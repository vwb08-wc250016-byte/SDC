<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ・お問い合わせ | SDC</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a
        class="header-home"
        role="link"
        tabindex="0"
        aria-label="SDC ホーム"
        aria-disabled="true"
        title="リンク先未設定"
        data-unconfigured-label="SDC ホーム"
      >
        <img class="header-logo" src="images/1261c.png" alt="SDC" />
      </a>
      <button
        class="menu-button"
        type="button"
        aria-label="メニューを開く"
        aria-expanded="false"
        aria-controls="global-menu"
        data-menu-button
      >
        <span class="menu-icon" aria-hidden="true">
          <span class="menu-icon__line"></span>
          <span class="menu-icon__line"></span>
          <span class="menu-icon__line"></span>
        </span>
      </button>
      <nav
        class="menu-panel"
        id="global-menu"
        aria-label="メインメニュー"
        aria-hidden="true"
        data-menu
        inert
      >
        <a
          role="link"
          tabindex="0"
          aria-disabled="true"
          title="リンク先未設定"
          data-unconfigured-label="SDCについて"
          >SDCについて</a
        >
        <a href="../index.html">
           部門別
        </a>
        <a
          role="link"
          tabindex="0"
          aria-disabled="true"
          title="リンク先未設定"
          data-unconfigured-label="ギャラリー"
          >ギャラリー</a
        >
        <a
          role="link"
          tabindex="0"
          aria-disabled="true"
          title="リンク先未設定"
          data-unconfigured-label="マイページ"
          >マイページ</a
        >
        <a href="../お知らせ/news.html">
           お知らせ
        </a>
        <a
          role="link"
          tabindex="0"
          aria-disabled="true"
          title="リンク先未設定"
          data-unconfigured-label="アクセス"
          >アクセス</a
        >
      </nav>
    </header>

    <main>
      <h1 class="page-title">FAQ</h1>
      <div class="page-subtitle">
        <span>よくある質問</span>
        <img src="images/a4128.svg" alt="" />
      </div>

      <section class="faq-section" id="faq" aria-label="よくある質問">
        <div class="faq-toolbar">
          <button
            class="filter-button"
            type="button"
            aria-expanded="false"
            aria-controls="faq-question-sheet"
            data-filter-button
          >
            絞り込み
          </button>
        </div>

        <div class="faq-list">
          <article class="faq-item">
            <div class="faq-row">
              <span class="marker" aria-hidden="true">
                <img src="images/9efcd.svg" alt="" />
                <span>Q</span>
              </span>
              <h2 class="question-text">開催場所はどこですか？</h2>
            </div>
            <div class="faq-row" data-answer>
              <span class="marker" aria-hidden="true">
                <img src="images/e1288.svg" alt="" />
                <span>A</span>
              </span>
              <button
                class="location-answer"
                type="button"
                aria-disabled="true"
                title="開催場所情報未設定"
                data-unconfigured-label="開催場所の表示"
              >
                クリックで開催場所を表示
              </button>
            </div>
          </article>

          <article class="faq-item">
            <div class="faq-row">
              <span class="marker" aria-hidden="true">
                <img src="images/22210.svg" alt="" />
                <span>Q</span>
              </span>
              <h2 class="question-text">無料駐車場はありますか？</h2>
            </div>
            <div class="faq-row" data-answer>
              <span class="marker" aria-hidden="true">
                <img src="images/8cc60.svg" alt="" />
                <span>A</span>
              </span>
              <p class="answer-text">
                209台有りますが、通常利用の方もいるので空きに<br />限りがある可能性があります。
              </p>
            </div>
          </article>

          <article class="faq-item">
            <div class="faq-row">
              <span class="marker" aria-hidden="true">
                <img src="images/3a028.svg" alt="" />
                <span>Q</span>
              </span>
              <h2 class="question-text">スケジュールはどこで確認できますか？</h2>
            </div>
            <div class="faq-row" data-answer>
              <span class="marker" aria-hidden="true">
                <img src="images/4d90b.svg" alt="" />
                <span>A</span>
              </span>
              <p class="answer-text">スケジュールについてはコチラから</p>
            </div>
          </article>
        </div>
      </section>

      <section class="contact-section" id="contact" aria-labelledby="contact-title">
        <div class="contact-heading">
          <h2 id="contact-title">お問い合わせ</h2>
          <img src="images/a4128.svg" alt="" />
        </div>

        <form class="contact-form" data-contact-form>
          <div class="form-fields">
            <div class="field">
              <label for="name">お名前</label>
              <input id="name" name="name" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="email">メールアドレス</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="tel">電話番号</label>
              <input id="tel" name="tel" type="tel" autocomplete="tel" required />
            </div>
            <div class="field">
              <label for="message">お問い合わせ内容</label>
              <textarea id="message" name="message" required></textarea>
            </div>
          </div>
          <button class="submit-button" type="submit">送信する</button>
          <p class="form-status" role="status" aria-live="polite" data-form-status></p>
        </form>
      </section>
    </main>

    <div class="faq-sheet" id="faq-question-sheet" aria-hidden="true" data-faq-sheet inert>
      <button
        class="faq-sheet__backdrop"
        type="button"
        tabindex="-1"
        aria-label="質問一覧を閉じる"
        data-faq-sheet-close
      ></button>
      <section
        class="faq-sheet__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="faq-sheet-title"
      >
        <header class="faq-sheet__header">
          <h2 id="faq-sheet-title">質問一覧</h2>
          <button class="faq-sheet__close" type="button" data-faq-sheet-close>閉じる</button>
        </header>
        <div class="faq-sheet__list" data-faq-sheet-list></div>
      </section>
    </div>

    <footer class="site-footer" id="footer">
      <div class="footer-inner">
        <img class="footer-logo" src="images/7834b.png" alt="SDC" />
        <nav class="footer-nav" aria-label="フッターメニュー">
          <a
            role="link"
            tabindex="0"
            aria-disabled="true"
            title="リンク先未設定"
            data-unconfigured-label="SDCについて"
            >SDCについて</a
          >
          <a
            role="link"
            tabindex="0"
            aria-disabled="true"
            title="リンク先未設定"
            data-unconfigured-label="部門別"
            >部門別</a
          >
          <a
            role="link"
            tabindex="0"
            aria-disabled="true"
            title="リンク先未設定"
            data-unconfigured-label="ギャラリー"
            >ギャラリー</a
          >
          <a
            role="link"
            tabindex="0"
            aria-disabled="true"
            title="リンク先未設定"
            data-unconfigured-label="マイページ"
            >マイページ</a
          >
          <a
            role="link"
            tabindex="0"
            aria-disabled="true"
            title="リンク先未設定"
            data-unconfigured-label="お知らせ"
            >お知らせ</a
          >
          <a
            role="link"
            tabindex="0"
            aria-disabled="true"
            title="リンク先未設定"
            data-unconfigured-label="アクセス"
            >アクセス</a
          >
        </nav>
        <div class="footer-actions">
          <a
            role="link"
            tabindex="0"
            aria-disabled="true"
            title="リンク先未設定"
            data-unconfigured-label="エントリー"
            >エントリーする</a
          >
          <a href="#contact">お問い合わせ</a>
        </div>
        <div class="footer-line-slot" aria-hidden="true">
          <img src="images/17d75.svg" alt="" />
        </div>
        <p class="copyright">@ SDC All Rights Reserved.</p>
      </div>
    </footer>

    <p class="visually-hidden" aria-live="polite" data-interaction-status></p>
    <script src="js/script.js"></script>
  </body>
</html>
